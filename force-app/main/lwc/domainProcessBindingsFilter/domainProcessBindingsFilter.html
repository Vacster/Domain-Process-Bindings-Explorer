<template>
    <div class="slds-page-header">
        <span class="slds-grid slds-align_absolute-center">
            <!-- TODO: Make icon dynamic based on sObjectDeveloperName -->
            <lightning-icon
                icon-name="standard:opportunity"
                class="slds-col slds-grow-none slds-m-right_small"
            ></lightning-icon>
            <span
                class="slds-col slds-grow-none slds-shrink-none slds-grid slds-grid_vertical-align-center"
            >
                <span class="slds-m-horizontal_xx-small">When a(n)</span>
                <c-entity-definition-selector
                    class="slds-show_inline-block slds-shrink-none"
                    onobject_changed={handleObjectChanged}
                ></c-entity-definition-selector>
                <span class="slds-m-horizontal_xx-small">record is</span>
                <lightning-combobox
                    class="slds-show_inline-block slds-shrink-none c-action-combobox"
                    label="Action"
                    variant="label-hidden"
                    value={selectedActionValue}
                    options={possibleActions}
                    onchange={handleActionChange}
                ></lightning-combobox>
            </span>
            <lightning-button-icon
                class="slds-grow-none slds-col_bump-left"
                icon-name="utility:refresh"
                variant="border-filled"
                onclick={handleRefresh}
                tooltip="Refresh the Domain Process Bindings"
            ></lightning-button-icon>
        </span>
    </div>
</template>
