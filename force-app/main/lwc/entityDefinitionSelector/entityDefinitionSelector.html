<template>
    <lightning-combobox
        class="slds-show_inline-block slds-shrink-none c-object-combobox"
        label="Object"
        variant="label-hidden"
        placeholder="Select Object"
        value={selectedSObjectDeveloperName}
        options={options}
        onchange={handleObjectChange}
        spinner-active={isLoading}
    ></lightning-combobox>
    <template if:true={hasBindingNamesError}>
        <p class="slds-text-color_error" role="alert">
            Unable to load objects with Domain Process Bindings.
        </p>
    </template>
</template>
